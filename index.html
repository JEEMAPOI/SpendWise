  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>SpendWise</h1>

    <p>Smart Money Management Made Simple</p>

    <p>Track your budget, expenses, and remaining balance.</p>

    <h2>Monthly Budget</h2>

    <input type="number" id="budgetInput" placeholder="Enter your monthly budget">

    <button id="setBudget">Set Budget</button>

    <h2>Add Expense</h2>

    <input type="text" id="expenseName" placeholder="Expense name">

    <input type="number" id="expenseAmount" placeholder="Price">

    <button id="addExpense">Add Expense</button>

    <h2>Expenses</h2>

    <ul id="expenseList"></ul>

    <h2>Remaining Balance</h2>

    <p id="remainingBalance">KES 0</p>

    <script src="script.js"></script>

</body>
</html>
